; PlatformIO build configuration (alternative to the Arduino IDE).
; Build:  pio run -e <environment>      Upload: pio run -e <environment> -t upload
; Monitor: pio device monitor
;
; Select the ESP32-P4 environment that matches the chip revision of your board.
; esptool prints the chip revision in its connection output during upload.

[platformio]
src_dir = EDU-Wind-Tunnel
default_envs = esp32p4

[env]
framework = arduino
monitor_speed = 115200
; Library versions match THIRD_PARTY_LICENSES.md and the CI workflow.
lib_deps =
    https://github.com/Dlloydev/QuickPID.git#3.1.9
    https://github.com/Dlloydev/sTune.git#2.4.0
    https://github.com/DFRobot/DFRobot_LWLP.git#V1.0.0
    https://github.com/DFRobot/DFRobot_RTU.git#V1.0.6
    https://github.com/DFRobot/DFRobot_BMP58X.git#v1.0.1

; ESP32-P4, chip revision before v3.0 (Arduino IDE: Chip Variant "Before v3.00")
; pioarduino 55.03.312 = arduino-esp32 3.3.12 (same core version as the CI workflow).
[env:esp32p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-p4

; ESP32-P4, chip revision v3.0 or newer (Arduino IDE: Chip Variant "v3.00 or newer")
[env:esp32p4_r3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-p4_r3

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
